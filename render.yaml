services:
  - type: web
    name: rokesh-inventory-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npx tsx src/server.ts
    healthCheckPath: /api/health
    # IMPORTANT — uploaded files (logos, item images, attachments) are saved to disk.
    # Render's normal disk is wiped on every deploy/restart, so uploads would disappear.
    # To keep them, use a paid instance (Starter or above) and uncomment `plan` and `disk`,
    # then change UPLOAD_DIR below to /var/data/uploads.
    # plan: starter
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: uploads            # with the disk enabled: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SIGNUP_MODE
        value: open
      - key: TRIAL_DAYS
        value: "14"
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_ADMIN_NAME
        value: Platform Admin
      - key: SUPPORT_EMAIL
        value: support@rokesh.com
      - key: PLATFORM_RAZORPAY_KEY_ID
        sync: false
      - key: PLATFORM_RAZORPAY_KEY_SECRET
        sync: false
      - key: PLATFORM_RAZORPAY_WEBHOOK_SECRET
        sync: false
